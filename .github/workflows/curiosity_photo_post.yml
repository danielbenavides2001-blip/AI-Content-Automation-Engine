name: Publish Curiosity Photo Post (Feed Images)

on:
  schedule:
    # 20 Publicaciones al día en el Feed cada hora iniciando a las 02:00 AM (02:00 AM - 09:00 PM Colombia/México GMT-5)
    - cron: '0 7 * * *'   # 02:00 AM GMT-5 (07:00 UTC)
    - cron: '0 8 * * *'   # 03:00 AM GMT-5 (08:00 UTC)
    - cron: '0 9 * * *'   # 04:00 AM GMT-5 (09:00 UTC)
    - cron: '0 10 * * *'  # 05:00 AM GMT-5 (10:00 UTC)
    - cron: '0 11 * * *'  # 06:00 AM GMT-5 (11:00 UTC)
    - cron: '0 12 * * *'  # 07:00 AM GMT-5 (12:00 UTC)
    - cron: '0 13 * * *'  # 08:00 AM GMT-5 (13:00 UTC)
    - cron: '0 14 * * *'  # 09:00 AM GMT-5 (14:00 UTC)
    - cron: '0 15 * * *'  # 10:00 AM GMT-5 (15:00 UTC)
    - cron: '0 16 * * *'  # 11:00 AM GMT-5 (16:00 UTC)
    - cron: '0 17 * * *'  # 12:00 PM GMT-5 (17:00 UTC)
    - cron: '0 18 * * *'  # 01:00 PM GMT-5 (18:00 UTC)
    - cron: '0 19 * * *'  # 02:00 PM GMT-5 (19:00 UTC)
    - cron: '0 20 * * *'  # 03:00 PM GMT-5 (20:00 UTC)
    - cron: '0 21 * * *'  # 04:00 PM GMT-5 (21:00 UTC)
    - cron: '0 22 * * *'  # 05:00 PM GMT-5 (22:00 UTC)
    - cron: '0 23 * * *'  # 06:00 PM GMT-5 (23:00 UTC)
    - cron: '0 0 * * *'   # 07:00 PM GMT-5 (00:00 UTC)
    - cron: '0 1 * * *'   # 08:00 PM GMT-5 (01:00 UTC)
    - cron: '0 2 * * *'   # 09:00 PM GMT-5 (02:00 UTC)
  workflow_dispatch:

jobs:
  publish-curiosity:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Poetry
        run: pipx install poetry

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'poetry'

      - name: Install dependencies
        run: poetry install

      - name: Create GCP Credentials
        env:
          GCP_JSON: ${{ secrets.GOOGLE_APPLICATION_CREDENTIALS_JSON }}
        run: |
          python -c "import os, json; f=open('gcp_credentials.json', 'w'); json.dump(json.loads(os.environ.get('GCP_JSON', '{}'), strict=False), f, indent=2)"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$(pwd)/gcp_credentials.json" >> $GITHUB_ENV

      - name: Run Curiosity Generation & Publish
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          GCP_LOCATION: ${{ secrets.GCP_LOCATION }}
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
          USE_VERTEX_AI_IMAGE: "true"
        run: |
          echo "🚀 Generating curiosity and image post for Facebook Feed..."
          poetry run python -m flows.curiosity_image_generator.main --publish

      - name: Commit and Push Changes (Tracking Repetition)
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add -f flows/curiosity_image_generator/curiosity_history.csv
          git commit -m "chore: update tracking and history [skip ci]" || echo "No changes to commit"
          git pull --rebase --autostash origin main || { git rebase --abort 2>/dev/null; echo "Rebase failed (conflict). Skipping push."; exit 0; }
          git push origin main || echo "No changes to push"
