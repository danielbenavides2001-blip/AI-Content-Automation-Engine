name: Publish Curiosity Photo Post

on:
  schedule:
    - cron: '0 13 * * *'   # 08:00 AM Colombia/Mexico (GMT-5)
    - cron: '0 16 * * *'   # 11:00 AM Colombia/Mexico (GMT-5)
    - cron: '0 19 * * *'   # 02:00 PM Colombia/Mexico (GMT-5)
    - cron: '0 22 * * *'   # 05:00 PM Colombia/Mexico (GMT-5)
    - cron: '0 1 * * *'    # 08:00 PM Colombia/Mexico (GMT-5)
    - cron: '0 4 * * *'    # 11:00 PM Colombia/Mexico (GMT-5)
  workflow_dispatch:

jobs:
  publish-curiosity:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Poetry
        run: pipx install poetry

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'poetry'

      - name: Install dependencies
        run: poetry install

      - name: Create GCP Credentials
        env:
          GCP_JSON: ${{ secrets.GOOGLE_APPLICATION_CREDENTIALS_JSON }}
        run: |
          python -c "import os, json; f=open('gcp_credentials.json', 'w'); json.dump(json.loads(os.environ.get('GCP_JSON', '{}'), strict=False), f, indent=2)"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$(pwd)/gcp_credentials.json" >> $GITHUB_ENV

      - name: Run Curiosity Generation & Publish
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          GCP_LOCATION: ${{ secrets.GCP_LOCATION }}
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
          USE_VERTEX_AI_IMAGE: "true"
        run: |
          echo "🚀 Generating curiosity and image post..."
          poetry run python -m flows.curiosity_image_generator.main --publish
