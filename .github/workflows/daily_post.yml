name: Daily Content Automation (3 Reels + 3 Images)

on:
  schedule:
    - cron: '0 12,14,16,18,20,22 * * *' # 7am, 9am, 11am, 1pm, 3pm, 5pm COT
  workflow_dispatch:
    inputs:
      force_type:
        description: '0=Image, 1=Video'
        required: false
        type: string

jobs:
  post-content:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Poetry
        run: pipx install poetry

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'poetry'

      - name: Setup FFmpeg
        uses: FedericoCarboni/setup-ffmpeg@v3

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Remotion Dependencies
        run: |
          cd flows/image_content_generator/remotion
          npm install

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libnss3 libnspr4 libatk1.0-0 libatk-bridge2.0-0 libcups2 libdrm2 libxkbcommon0 libxcomposite1 libxdamage1 libxfixes3 libxrandr2 libgbm1 libasound2t64

      - name: Install dependencies
        run: poetry install

      - name: Create GCP Credentials
        env:
          GCP_JSON: ${{ secrets.GOOGLE_APPLICATION_CREDENTIALS_JSON }}
        run: |
          python -c "import os, json; f=open('gcp_credentials.json', 'w'); json.dump(json.loads(os.environ.get('GCP_JSON', '{}'), strict=False), f, indent=2)"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$(pwd)/gcp_credentials.json" >> $GITHUB_ENV

      - name: Run Automation
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
        run: |
          # Determinar si toca Video o Imagen (Alternar basado en la hora UTC)
          # Horas 12, 16, 20 -> Video (Reels)
          # Horas 14, 18, 22 -> Imagen
          HOUR=$(date +%H)
          export POST_TYPE="video"
          
          if [[ "${{ github.event.inputs.force_type }}" == "0" ]]; then
            export POST_TYPE="image"
          elif [[ "${{ github.event.inputs.force_type }}" == "1" ]]; then
            export POST_TYPE="video"
          elif [[ "$HOUR" == "14" || "$HOUR" == "18" || "$HOUR" == "22" ]]; then
            export POST_TYPE="image"
          fi

          echo "🚀 Running automation for POST_TYPE: $POST_TYPE (Hour: $HOUR)"
          poetry run python flows/image_content_generator/pipeline/daily_automated_content.py

      - name: Commit and Push Changes (Tracking Repetition)
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add .
          git commit -m "chore: update tracking and history [skip ci]" || echo "No changes to commit"
          git pull --rebase --autostash origin main
          git push origin main || echo "No changes to push"
